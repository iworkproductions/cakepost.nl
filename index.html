<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cakepost — coming soon</title>
    <meta name="description" content="Cakepost komt eraan.">

    <!-- Fonts: Fraunces voor display (karakter, taart-energie), Inter Tight voor body (modern, schoon) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --pink: #FFD6E0;        /* zachte poederroze achtergrond */
            --pink-deep: #FF6B9D;   /* dieper roze accent */
            --red: #E63946;         /* warm cake-rood, het kernaccent */
            --red-dark: #B81D2A;    /* donkerder rood voor hover */
            --ink: #1A0F12;         /* bijna-zwart met warme ondertoon */
            --paper: #FFF8F5;       /* off-white voor contrast */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background: var(--pink);
            color: var(--ink);
            font-family: 'Inter Tight', system-ui, sans-serif;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* Subtiele grain-textuur voor warmte, geen platte kleur */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' /%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.4'/%3E%3C/svg%3E");
            opacity: 0.08;
            pointer-events: none;
            z-index: 1;
        }

        /* Rode cirkel als focal point — geometric, gedurfd */
        .orb {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 42vmin;
            height: 42vmin;
            border-radius: 50%;
            background: var(--red);
            z-index: 2;
            animation: pulse 6s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.04); }
        }

        /* Top bar */
        header {
            position: relative;
            z-index: 10;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Inter Tight', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        header .left { color: var(--ink); }
        header .right { color: var(--ink); }

        /* Hoofdcontent — gecentreerd, met diagonale overlap op de orb */
        main {
            flex: 1;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 2rem;
            text-align: center;
        }

        .wordmark {
            font-family: 'Fraunces', serif;
            font-weight: 900;
            font-size: clamp(4rem, 18vw, 16rem);
            line-height: 0.85;
            letter-spacing: -0.04em;
            color: var(--ink);
            font-variation-settings: "opsz" 144;
            mix-blend-mode: multiply;
            opacity: 0;
            animation: rise 1.2s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .wordmark .dot {
            color: var(--red);
            display: inline-block;
            font-style: italic;
        }

        .tagline {
            margin-top: 2rem;
            font-family: 'Fraunces', serif;
            font-style: italic;
            font-weight: 400;
            font-size: clamp(1.1rem, 2vw, 1.5rem);
            color: var(--ink);
            letter-spacing: -0.01em;
            max-width: 28ch;
            mix-blend-mode: multiply;
            opacity: 0;
            animation: rise 1.2s 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        footer {
            position: relative;
            z-index: 10;
            padding: 2.5rem 3rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-family: 'Inter Tight', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        footer a {
            color: var(--ink);
            text-decoration: none;
            position: relative;
            transition: color 0.3s ease;
        }

        footer a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -3px;
            width: 100%;
            height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        footer a:hover {
            color: var(--red-dark);
        }

        footer a:hover::after {
            transform: scaleX(1);
            background: var(--red-dark);
        }

        /* Mobile aanpassingen */
        @media (max-width: 640px) {
            header, footer {
                padding: 1.5rem 1.5rem;
                font-size: 0.65rem;
            }

            footer {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }

            .orb {
                width: 60vmin;
                height: 60vmin;
            }
        }
    </style>
</head>
<body>
    <div class="orb" aria-hidden="true"></div>

    <header>
        <div class="left">cakepost</div>
        <div class="right">2026</div>
    </header>

    <main>
        <h1 class="wordmark">cake<span class="dot">.</span>post</h1>
        <p class="tagline">Iets nieuws komt eraan. Stuur post.</p>
    </main>

    <footer>
        <a href="mailto:hello@cakepost.nl">hello@cakepost.nl</a>
        <div>coming soon</div>
    </footer>
</body>
</html>
